<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova — E-Commerce Storefront</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <header class="glass-nav">
            <div class="logo">
                <span class="gradient-text">Shop</span>Nova
            </div>
            <div class="nav-links">
                <a href="/swagger" target="_blank">Swagger API</a>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="dashboard">
            <!-- Product Catalog -->
            <section class="catalog-section">
                <h2>Featured Products</h2>
                <div class="product-grid" id="productGrid">
                    <!-- Products injected via JS -->
                    <div class="loading">Loading products...</div>
                </div>
            </section>

            <!-- Shopping Cart Panel -->
            <aside class="cart-panel glass-panel">
                <div class="cart-header">
                    <h3>Your Cart</h3>
                    <span class="cart-badge" id="cartCount">0</span>
                </div>
                <div class="cart-items" id="cartItems">
                    <p class="empty-cart">Cart is empty.</p>
                </div>
                <div class="cart-footer">
                    <div class="cart-total">
                        <span>Total:</span>
                        <span class="gradient-text" id="cartTotal">$0.00</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn" disabled>
                        <span>Secure Checkout</span>
                        <div class="btn-glow"></div>
                    </button>
                </div>
                <div id="checkoutStatus" class="checkout-status"></div>
            </aside>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
